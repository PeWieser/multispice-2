name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Typen
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build (statischer Export)
        run: npx next build
      - name: Importer-Tests
        run: npm run test --silent

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Playwright-Browser
        run: npx playwright install --with-deps
      - name: Build (statischer Export)
        run: npx next build
      - name: E2E-Tests (Chromium)
        run: npm run test:e2e
      - name: E2E-Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
