name: Windows Desktop App

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App (Portable & Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Web App Dependencies
        run: npm ci

      - name: Build Static Next.js Bundle (out/)
        run: |
          npx next build
          if (-not (Test-Path "out/index.html")) {
            Write-Output "::error title=Next.js Static Export Missing::out/index.html was not generated by next build"
            exit 1
          }

      - name: Assemble Electron Packaging Workspace
        run: |
          New-Item -ItemType Directory -Force -Path desktop-build | Out-Null
          Copy-Item desktop/package.json desktop-build/package.json -Force
          Copy-Item desktop/main.cjs desktop-build/main.cjs -Force
          Copy-Item desktop/preload.cjs desktop-build/preload.cjs -Force
          Copy-Item desktop/portable-launcher.cs desktop-build/portable-launcher.cs -Force
          Copy-Item desktop/pack-portable.cjs desktop-build/pack-portable.cjs -Force
          Copy-Item -Recurse -Force out desktop-build/out

      - name: Build Windows Setup .exe and Instant-Splash Portable .exe
        working-directory: desktop-build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Electron Dependency Install Failed::npm install inside desktop-build exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          node -e "const fs = require('fs'); const pngToIco = require('png-to-ico'); pngToIco('../public/favicon.png').then(buf => fs.writeFileSync('icon.ico', buf)).catch(err => { console.error(err); process.exit(1); });"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Icon Generation Failed::Could not convert public/favicon.png to icon.ico"
            exit $LASTEXITCODE
          }
          npx electron-builder --win nsis dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Electron Builder Failed::electron-builder exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:PortableStub.exe /win32icon:icon.ico /resource:out\favicon.png,favicon.png /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll portable-launcher.cs
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Portable Launcher Compile Failed::csc.exe exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path "payload.zip") { Remove-Item "payload.zip" -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory("dist\win-unpacked", "payload.zip", [System.IO.Compression.CompressionLevel]::NoCompression, $false)
          node pack-portable.cjs
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Portable Packager Failed::pack-portable.cjs exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $exes = Get-ChildItem -Path "dist" -Filter "*.exe" -File | Select-Object -ExpandProperty Name
          Write-Output "::notice title=Erzeugte Dateien::$($exes -join ', ')"

      - name: Upload Windows App Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: MultiSpice-Windows-App
          path: |
            desktop-build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
