name: Windows Desktop App

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Build Windows Desktop App (Portable & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Web App Dependencies
        run: npm ci

      - name: Build Static Next.js Bundle (out/)
        run: npm run build

      - name: Assemble Electron Packaging Workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win-app | Out-Null
          Copy-Item -Path desktop/package.json -Destination dist-win-app/package.json -Force
          Copy-Item -Path desktop/main.cjs -Destination dist-win-app/main.cjs -Force
          Copy-Item -Path desktop/preload.cjs -Destination dist-win-app/preload.cjs -Force
          Copy-Item -Path desktop/make-splash-bmp.cjs -Destination dist-win-app/make-splash-bmp.cjs -Force
          Copy-Item -Path public/favicon.png -Destination dist-win-app/icon.png -Force
          Copy-Item -Path out -Destination dist-win-app/out -Recurse -Force
          node dist-win-app/make-splash-bmp.cjs

      - name: Build Windows Portable .exe and NSIS Installer .exe
        shell: pwsh
        working-directory: dist-win-app
        run: |
          $ErrorActionPreference = "Continue"
          npm install 2>&1 | Tee-Object -FilePath npm-install.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content npm-install.log -Tail 25) -join " | "
            Write-Output "::error title=npm install failed::$tail"
            exit 1
          }
          npx electron-builder --win portable nsis --x64 --publish never 2>&1 | Tee-Object -FilePath builder.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content builder.log -Tail 30) -join " | "
            Write-Output "::error title=electron-builder failed::$tail"
            exit 1
          }
          $exes = Get-ChildItem -Path dist -Filter "*.exe" | ForEach-Object { "$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
          $summary = $exes -join ", "
          Write-Output "::notice title=Windows Build Erfolgreich::Erzeugte Dateien: $summary"

      - name: Upload Windows App Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: MultiSpice-Windows-App
          path: |
            dist-win-app/dist/*.exe
          if-no-files-found: error
          retention-days: 30
